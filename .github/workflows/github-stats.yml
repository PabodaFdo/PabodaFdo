name: Generate GitHub Analytics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create profile directory
        run: mkdir -p profile

      # ==============================
      # GitHub Statistics
      # ==============================
      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&bg_color=061A40&title_color=4169E1&text_color=EAF2FF&icon_color=4169E1&border_color=30363d
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ==============================
      # Top Programming Languages
      # ==============================
      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&bg_color=061A40&title_color=4169E1&text_color=EAF2FF&border_color=30363d
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ==============================
      # GitHub Contribution Streak
      # ==============================
      - name: Generate contribution streak
        uses: zients/github-readme-streak-stats@v2
        with:
          options: user=${{ github.repository_owner }}&theme=dark&background=061A40&border=30363d
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ==============================
      # Daily GitHub Activity Graph
      # ==============================
      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: bg_color=061A40&color=EAF2FF&line=4169E1&point=EAF2FF&area=true&area_color=1B3A8A&border_color=30363d&custom_title=GitHub%20Contribution%20Activity&days=31
          output_path: profile/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ==============================
      # Commit Generated SVG Files
      # ==============================
      - name: Commit analytics cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          if git diff --cached --quiet; then
            echo "No analytics changes."
            exit 0
          fi

          git commit -m "Update GitHub analytics"
          git push
